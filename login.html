  <form class="login-card" onsubmit="demoLogin(event)">
    <h1>Student Login</h1>
    <p>Demo login. Use any email and password.</p>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <a href="pages/admin/admin-login.html">Admin Login</a>
  </form>
</main>
<script>
function demoLogin(e) {
  e.preventDefault();
  localStorage.setItem('tl_user', document.getElementById('email').value);
  location.href='dashboard.html';
}
</script>
