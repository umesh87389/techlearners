<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal Login | SHM Academy</title>
  <link rel="icon" type="image/jpeg" href="/assets/school-logo.jpg">
  <link rel="stylesheet" href="/static/css/portfolio.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .login-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 0.35rem;
    }
    .login-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.15s;
    }
    .login-input:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }
    .login-btn {
      background: #1e3a8a;
      color: #ffffff;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }
    .login-btn:hover {
      background: #172554;
    }
    .error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .return-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
      text-decoration: none;
      font-weight: 600;
    }
    .return-link:hover {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="margin-bottom: 1rem;">
        <img src="/assets/school-logo.jpg" alt="SHM Academy" style="height: 52px; border-radius: 6px;">
      </div>
      <span class="login-badge">Confidential Teacher Portal</span>
      <h1 class="login-title">Teacher Dashboard Login</h1>
      <p class="login-subtitle">SHM Academy • Student Portfolio Evaluation System</p>

      {% if error %}
      <div class="error-alert">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/teacher/login" class="login-form">
        <div class="form-group">
          <label for="password">Teacher Access Passcode</label>
          <input type="password" id="password" name="password" class="login-input" placeholder="Enter teacher passcode" required autofocus autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">
          <span>🔒</span> Verify &amp; Open Dashboard
        </button>
      </form>

      <a href="/" class="return-link">← Go to Student Portfolio Page</a>
    </div>
  </div>

</body>
</html>
