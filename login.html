<main class="page center-page">
  <form class="login-card" onsubmit="studentLogin(event)">
    <h1>Student Login</h1>
    <p>Sign in with your student account or create a new account.</p>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button class="btn" type="submit">Login</button>
    <button class="btn secondary" type="button" onclick="studentRegister(event)">Create Account</button>
    <button class="btn google-btn" type="button" onclick="studentGoogleLogin()">Continue with Google</button>
    <p id="studentAuthMessage" class="muted"></p>
    <a href="pages/admin/admin-login.html">Admin Login</a>
  </form>
</main>
